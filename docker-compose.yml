# CryptoGuard behind an existing Traefik instance (Docker provider).
# Traefik settings come from .env (copy .env.example); read the real values off
# your other Traefik-routed containers (see DEPLOY.md, step 2).
services:
  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    networks: [internal]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    networks: [internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.cryptoguard.rule=Host(`${DOMAIN:-cryptoguard.olamide.cloud}`)
      - traefik.http.routers.cryptoguard.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.cryptoguard.tls=true
      - traefik.http.routers.cryptoguard.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.cryptoguard.loadbalancer.server.port=80

networks:
  internal:
