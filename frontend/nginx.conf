# Serves the built React app and proxies /api to the FastAPI container.
# Sits behind the host's Nginx (TLS), so trust X-Forwarded-For from the Docker network.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Simulations cost CPU; PDFs cost more.
limit_req_zone $binary_remote_addr zone=sim:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=pdf:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/report {
        limit_req zone=pdf burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=sim burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
